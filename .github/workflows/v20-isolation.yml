name: "V20 | Headroom isolation preflight ONLY"

# Manual trigger only. No Headroom, models, secrets or private project files.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: skills-headroom-v20-preflight
  cancel-in-progress: false

jobs:
  isolation-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Validate runner and Docker daemon
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Host: ${RUNNER_OS}, ${RUNNER_ARCH}"
          test "${RUNNER_OS}" = Linux
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          command -v docker
          docker version --format 'Client={{.Client.Version}} Server={{.Server.Version}}'
          test "$(docker info --format '{{.OSType}}')" = linux
          docker info --format 'Architecture={{.Architecture}} CPUs={{.NCPU}} MemBytes={{.MemTotal}} Security={{json .SecurityOptions}}'
          echo "PASS: Docker daemon responds."

      - name: Validate bounded container controls with inert data
        shell: bash
        run: |
          set -Eeuo pipefail
          # Only an official, inert Alpine image is downloaded (before container startup).
          image='docker.io/library/alpine:3.21'
          docker pull "${image}"
          docker image inspect "${image}" --format 'ImageID={{.Id}} RepoDigests={{json .RepoDigests}}'
          cid="$(docker create \
            --network none \
            --read-only \
            --user 65534:65534 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 2g \
            --memory-swap 2g \
            --cpus 1 \
            --ipc private \
            --pid private \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --entrypoint /bin/sh \
            "${image}" -euc '
              test "$(id -u)" = 65534
              grep -Eq "^NoNewPrivs:[[:space:]]*1$" /proc/self/status
              grep -Eq "^CapEff:[[:space:]]*0000000000000000$" /proc/self/status
              if touch /v20-must-not-write 2>/dev/null; then
                echo "FAIL: writable rootfs"; exit 11
              fi
              if wget -q -T 2 -O /dev/null http://1.1.1.1 2>/dev/null; then
                echo "FAIL: unexpected outbound networking"; exit 12
              fi
              if [ -f /sys/fs/cgroup/memory.max ]; then
                test "$(cat /sys/fs/cgroup/memory.max)" = 2147483648
                test "$(cat /sys/fs/cgroup/pids.max)" = 128
                set -- $(cat /sys/fs/cgroup/cpu.max)
                test "$1" != max
                test "$1" -le "$2"
              elif [ -f /sys/fs/cgroup/memory/memory.limit_in_bytes ]; then
                test "$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)" = 2147483648
                test "$(cat /sys/fs/cgroup/pids/pids.max)" = 128
                quota=$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)
                period=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)
                test "$quota" -gt 0 && test "$quota" -le "$period"
              else
                echo "BLOCKED: no readable memory, CPU, pids cgroup limits"; exit 13
              fi
              echo "PASS: in-container checks"
            ')"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker inspect "${cid}" > "${RUNNER_TEMP}/skills-v20-docker-inspect.json"
          python3 - "${RUNNER_TEMP}/skills-v20-docker-inspect.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding='utf-8'))[0]
          h, c = d['HostConfig'], d['Config']
          assert h['NetworkMode'] == 'none', 'network not denied'
          assert h['ReadonlyRootfs'] is True, 'rootfs not read-only'
          assert h['Privileged'] is False, 'privileged container'
          assert h['CapDrop'] and 'ALL' in h['CapDrop'], 'capabilities not dropped'
          assert any('no-new-privileges' in x for x in (h['SecurityOpt'] or [])), 'NNP missing'
          assert int(h['Memory']) == 2147483648, 'memory limit not 2GiB'
          assert int(h['MemorySwap']) == 2147483648, 'memory+swap cap missing'
          assert int(h['NanoCpus']) == 1000000000, 'CPU limit not 1'
          assert int(h['PidsLimit']) == 128, 'pids limit not 128'
          assert not (h.get('Binds') or []), 'host binds forbidden'
          assert not (h.get('Mounts') or []), 'host mounts forbidden'
          assert c['User'] == '65534:65534', 'user is not specified non-root'
          assert h.get('IpcMode') == 'private', 'IPC not private'
          assert h.get('PidMode') in ('', 'private'), 'PID namespace not private'
          print('PASS: Docker configuration and no host mounts')
          PY
          docker start -a "${cid}"
          test "$(docker inspect -f '{{.State.ExitCode}}' "${cid}")" = 0
          {
            echo '## V20 isolation preflight: scoped PASS'
            echo '- Headroom was not installed, imported, or executed.'
            echo '- No private project data or credentials were used.'
            echo '- This is NOT a full security certification or permission for Headroom execution.'
          } >> "${GITHUB_STEP_SUMMARY}"
